<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Radar Escanteios 0-10 Min Pro</title>
    <style>
        :root {
            --bg-color: #0d1117;
            --card-bg: #161b22;
            --text-color: #c9d1d9;
            --primary: #2ea043;
            --danger: #da3633;
            --border: #30363d;
            --highlight: #58a6ff;
            --warning: #e3b341;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, sans-serif; }

        body { background-color: var(--bg-color); color: var(--text-color); padding: 20px; max-width: 600px; margin: auto; }

        header { text-align: center; margin-bottom: 20px; padding-bottom: 15px; border-bottom: 1px solid var(--border); }
        header h1 { color: var(--highlight); font-size: 1.5rem; }

        .dashboard {
            display: flex; justify-content: space-between; background-color: var(--card-bg);
            padding: 15px; border-radius: 8px; margin-bottom: 20px; border: 1px solid var(--border);
        }
        .stat-box { text-align: center; width: 33%; }
        .stat-box span { display: block; font-size: 0.75rem; color: #8b949e; text-transform: uppercase; margin-bottom: 5px; }
        .stat-box strong { font-size: 1.1rem; color: #fff; }

        .section-container {
            background-color: var(--card-bg); padding: 15px; border-radius: 8px;
            margin-bottom: 20px; border: 1px solid var(--border);
        }
        .section-title { font-size: 1rem; color: var(--highlight); margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center;}

        .radar-card {
            background-color: var(--bg-color); border: 1px solid var(--border); padding: 12px;
            border-radius: 6px; margin-bottom: 12px; border-left: 4px solid var(--warning);
        }
        .radar-info h4 { font-size: 0.95rem; color: #fff; margin-bottom: 2px; }
        .radar-info p { font-size: 0.78rem; color: #8b949e; margin-bottom: 8px; }
        
        .simulador-box {
            background: rgba(22, 27, 34, 0.9); border: 1px solid var(--border); padding: 10px; border-radius: 6px; margin-top: 8px;
        }
        .simulador-row { display: flex; gap: 8px; margin-bottom: 8px; }
        .simulador-row select { flex: 1; padding: 6px; background: var(--bg-color); border: 1px solid var(--border); color: #fff; border-radius: 4px; font-size: 0.8rem; }

        .analise-resultado {
            background: rgba(88, 166, 255, 0.05); border: 1px dashed var(--border); padding: 10px; border-radius: 4px;
            font-size: 0.78rem; color: #8b949e; margin-top: 8px; line-height: 1.4;
        }
        .analise-resultado b { color: var(--text-color); }

        .radar-actions { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; border-top: 1px solid var(--border); padding-top: 8px; }
        .btn-radar { background-color: var(--primary); color: #fff; padding: 6px 14px; border: none; border-radius: 4px; font-size: 0.8rem; cursor: pointer; font-weight: bold; }

        .form-group { margin-bottom: 10px; }
        .form-group label { display: block; margin-bottom: 5px; font-size: 0.85rem; color: #8b949e; }
        .form-group input, .form-group select { 
            width: 100%; padding: 10px; background-color: var(--bg-color); border: 1px solid var(--border); color: #fff; border-radius: 4px; 
        }
        .row-inputs { display: flex; gap: 10px; }
        .row-inputs .form-group { flex: 1; }

        button { width: 100%; padding: 10px; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .btn-add { background-color: var(--border); color: #fff; margin-top: 5px; }
        .btn-confirm { background-color: var(--primary); color: #fff; margin-top: 10px; font-size: 1.1rem; }
        
        .ticket-container { display: none; border-left: 4px solid var(--highlight); }
        .ticket-header { display: flex; justify-content: space-between; margin-bottom: 10px; border-bottom: 1px solid var(--border); padding-bottom: 10px; }
        .ticket-list { list-style: none; margin-bottom: 15px; font-size: 0.9rem; }
        .ticket-list li { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; border-bottom: 1px dashed var(--border); font-size: 0.85rem; }
        .ticket-list li button { width: auto; padding: 2px 8px; background: var(--danger); color: white; font-size: 0.7rem; }

        .bet-card { background-color: var(--card-bg); padding: 15px; border-radius: 8px; margin-bottom: 15px; border: 1px solid var(--border); border-left: 4px solid #8b949e; }
        .status-green { border-left-color: var(--primary); }
        .status-red { border-left-color: var(--danger); }
        .status-pending { border-left-color: var(--highlight); }

        .bet-header { display: flex; justify-content: space-between; margin-bottom: 10px; }
        .bet-type { font-size: 0.8rem; background: var(--bg-color); padding: 3px 8px; border-radius: 12px; color: var(--highlight); }
        .bet-finances { font-size: 0.9rem; color: #fff; text-align: right; }

        .leg-item { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-top: 1px solid var(--border); }
        .leg-info { font-size: 0.85rem; }
        .leg-actions button { width: auto; padding: 4px 8px; font-size: 0.8rem; margin-left: 5px; }
        .btn-g { background-color: var(--primary); color: white; }
        .btn-r { background-color: var(--danger); color: white; }
        .badge { padding: 3px 6px; border-radius: 4px; font-size: 0.75rem; font-weight: bold; }
        .badge-green { background: rgba(46, 160, 67, 0.2); color: var(--primary); }
        .badge-red { background: rgba(218, 54, 51, 0.2); color: var(--danger); }
    </style>
</head>
<body>

    <header>
        <h1>🎯 Escanteios 0-10 Min Pro</h1>
        <p style="font-size: 0.8rem; color: #8b949e;">Auditoria Crítica e Simulador Avançado</p>
    </header>

    <div class="dashboard">
        <div class="stat-box">
            <span>Investido</span>
            <strong id="dash-invested">R$ 0.00</strong>
        </div>
        <div class="stat-box">
            <span>Retorno</span>
            <strong id="dash-return" style="color: var(--primary);">R$ 0.00</strong>
        </div>
        <div class="stat-box">
            <span>Lucro (L/P)</span>
            <strong id="dash-profit">R$ 0.00</strong>
        </div>
    </div>

    <!-- RADAR GLOBAL -->
    <div class="section-container" style="border-left: 4px solid var(--warning);">
        <h3 class="section-title">📡 Radar Global & Análise Crítica</h3>
        <div id="radar-list">
            <p style="font-size: 0.85rem; color: #8b949e; text-align: center;">Carregando análises dos jogos...</p>
        </div>
    </div>

    <!-- ENTRADA MANUAL -->
    <div class="section-container">
        <h3 class="section-title" style="color: #fff;">+ Nova Entrada Manual</h3>
        <div class="form-group">
            <label>Jogo (Ex: Real Madrid x City)</label>
            <input type="text" id="match-name" placeholder="Nome dos times">
        </div>
        
        <div class="row-inputs">
            <div class="form-group">
                <label>Mercado</label>
                <select id="match-market">
                    <option value="Total (>0-10)">Total (Combinado)</option>
                    <option value="Casa (>0-10)">Time da Casa (Home)</option>
                    <option value="Visitante (>0-10)">Visitante (Away)</option>
                </select>
            </div>
            <div class="form-group">
                <label>Linha</label>
                <select id="match-line">
                    <option value="Mais de 0.5">Mais de 0.5</option>
                    <option value="Mais de 1.5">Mais de 1.5</option>
                    <option value="Mais de 2.5">Mais de 2.5</option>
                </select>
            </div>
        </div>

        <div class="row-inputs">
            <div class="form-group">
                <label>Odd</label>
                <input type="number" id="match-odd" step="0.01" placeholder="1.50">
            </div>
        </div>
        
        <button class="btn-add" onclick="window.addToTicket()">Adicionar ao Bilhete</button>
    </div>

    <!-- BILHETE -->
    <div class="section-container ticket-container" id="ticket-container">
        <div class="ticket-header">
            <strong>Seu Bilhete</strong>
            <span style="color: var(--highlight);">Odd Total: <b id="ticket-total-odd">1.00</b></span>
        </div>
        <ul class="ticket-list" id="ticket-list"></ul>
        
        <div class="form-group">
            <label>Valor da Aposta (Stake em R$)</label>
            <input type="number" id="ticket-stake" step="1" placeholder="Ex: 10.00">
        </div>
        <button class="btn-confirm" onclick="window.confirmBet()">Confirmar Aposta</button>
    </div>

    <!-- HISTÓRICO -->
    <div id="bets-history">
        <h3 class="section-title">Histórico de Entradas</h3>
        <div id="bet-list"></div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
        import { getAnalytics } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-analytics.js";
        import { getFirestore, collection, addDoc, onSnapshot, doc, updateDoc, query, orderBy, serverTimestamp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAq0f7x4S4AKJg_WajwxZu70RTIWyw1zTw",
            authDomain: "cantos10minutos.firebaseapp.com",
            projectId: "cantos10minutos",
            storageBucket: "cantos10minutos.firebasestorage.app",
            messagingSenderId: "613047782664",
            appId: "1:613047782664:web:300f9144c72ba2dfa330bd",
            measurementId: "G-LNW1ZTQQX9"
        };

        const app = initializeApp(firebaseConfig);
        const analytics = getAnalytics(app);
        const db = getFirestore(app);
        
        const betsCol = collection(db, "escanteios_bets");
        const radarCol = collection(db, "jogos_do_dia");

        let currentTicket = [];
        let allBets = [];

        function calcularPoisson(lambda, k) {
            let pMenosQueK = 0;
            for (let i = 0; i < k; i++) {
                pMenosQueK += (Math.exp(-lambda) * Math.pow(lambda, i)) / Fatorial(i);
            }
            let chance = (1 - pMenosQueK) * 100;
            return Math.max(5, Math.min(98, chance));
        }

        function Fatorial(n) {
            if (n === 0 || n === 1) return 1;
            let acumulado = 1;
            for (let i = 2; i <= n; i++) acumulado *= i;
            return acumulado;
        }

        const qRadar = query(radarCol, orderBy("match", "asc"));
        onSnapshot(qRadar, (snapshot) => {
            const list = document.getElementById('radar-list');
            list.innerHTML = '';
            
            if (snapshot.empty) {
                list.innerHTML = '<p style="font-size: 0.85rem; color: #8b949e; text-align: center;">Nenhum jogo no radar.</p>';
                return;
            }

            snapshot.forEach(doc => {
                let jogo = doc.data();
                let docId = doc.id;
                let matchName = jogo.match;
                let horario = jogo.horario || '--:--';
                let analiseBase = jogo.analise_base || "Análise tática em andamento.";
                
                let lCasa = jogo.lambda_casa || 3.5;
                let lFora = jogo.lambda_fora || 2.5;

                list.innerHTML += `
                    <div class="radar-card" id="card-${docId}">
                        <div class="radar-info">
                            <h4>${matchName} 🕒 ${horario}</h4>
                            <p>Selecione o mercado e linha para ver a auditoria detalhada:</p>
                        </div>
                        
                        <div class="simulador-box">
                            <div class="simulador-row">
                                <select id="mercado-${docId}" onchange="atualizarSimulacao('${docId}', ${lCasa}, ${lFora}, '${encodeURIComponent(analiseBase)}')">
                                    <option value="Total">Total (Combinado)</option>
                                    <option value="Casa">Time da Casa (Home)</option>
                                    <option value="Visitante">Visitante (Away)</option>
                                </select>
                                <select id="linha-${docId}" onchange="atualizarSimulacao('${docId}', ${lCasa}, ${lFora}, '${encodeURIComponent(analiseBase)}')">
                                    <option value="0.5">Mais de 0.5</option>
                                    <option value="1.5">Mais de 1.5</option>
                                    <option value="2.5">Mais de 2.5</option>
                                </select>
                            </div>
                            
                            <div class="analise-resultado" id="res-${docId}">
                                <b>Auditoria:</b> Carregando laudo...
                            </div>
                        </div>

                        <div class="radar-actions">
                            <span style="font-size:0.72rem; color:#8b949e;">Modelo Poisson & Must-Win</span>
                            <button class="btn-radar" onclick="adicionarDoSimulador('${docId}', '${matchName}')">+ Bilhete</button>
                        </div>
                    </div>
                `;
                
                setTimeout(() => atualizarSimulacao(docId, lCasa, lFora, encodeURIComponent(analiseBase)), 100);
            });
        });

        window.atualizarSimulacao = function(docId, lCasa, lFora, analiseEncoded) {
            let mercadoSel = document.getElementById(`mercado-${docId}`).value;
            let linhaSel = document.getElementById(`linha-${docId}`).value;
            let analiseBase = decodeURIComponent(analiseEncoded);
            
            let lambdaAlvo = 0;
            let k = 1;
            
            if (mercadoSel === "Total") {
                lambdaAlvo = ((lCasa + lFora) / 90) * 10 * 1.15;
            } else if (mercadoSel === "Casa") {
                lambdaAlvo = (lCasa / 90) * 10 * 1.25;
            } else {
                lambdaAlvo = (lFora / 90) * 10 * 1.10;
            }

            if (linhaSel === "0.5") k = 1;
            if (linhaSel === "1.5") k = 2;
            if (linhaSel === "2.5") k = 3;

            let chance = calcularPoisson(lambdaAlvo, k);
            let oddJusta = (100 / chance) * 0.95;
            if (oddJusta < 1.05) oddJusta = 1.05;

            // Geração de laudo crítico personalizado por linha e mercado
            let veredito = "";
            if (linhaSel === "0.5") {
                veredito = chance > 72 ? "<b>Veredito:</b> Entrada altamente recomendada pela alta probabilidade de escanteio precoce." : "<b>Veredito:</b> Linha conservadora, mas exige cautela caso o jogo comece estudado.";
            } else if (linhaSel === "1.5") {
                veredito = chance > 55 ? "<b>Veredito:</b> Excelente valor (Edge positivo). O perfil de pressão inicial suporta a linha de 2 ou mais cantos." : "<b>Veredito:</b> Risco alto para 2 cantos nos primeiros 10 minutos. O histórico não garante volume suficiente.";
            } else {
                veredito = chance > 35 ? "<b>Veredito:</b> Oportunidade de Odd alta (Tiro longo). Altamente especulativo, indicado apenas para jogos de extrema pressão." : "<b>Veredito:</b> Inviável estatisticamente. Chance muito baixa para 3+ escanteios neste início.";
            }

            let resBox = document.getElementById(`res-${docId}`);
            resBox.setAttribute('data-chance', chance.toFixed(1));
            resBox.setAttribute('data-odd', oddJusta.toFixed(2));
            resBox.setAttribute('data-mercado', mercadoSel === "Total" ? "Total (>0-10)" : (mercadoSel === "Casa" ? "Casa (>0-10)" : "Visitante (>0-10)"));
            resBox.setAttribute('data-linha', `Mais de ${linhaSel}`);

            resBox.innerHTML = `
                <b>Probabilidade:</b> <span style="color:var(--primary);">${chance.toFixed(1)}%</span> | 
                <b>Odd Justa:</b> <span style="color:var(--warning);">@${oddJusta.toFixed(2)}</span><br>
                <b>Contexto do Jogo:</b> ${analiseBase}<br>
                ${veredito}
            `;
        };

        window.adicionarDoSimulador = function(docId, matchName) {
            let resBox = document.getElementById(`res-${docId}`);
            let market = resBox.getAttribute('data-mercado') || "Total (>0-10)";
            let line = resBox.getAttribute('data-linha') || "Mais de 0.5";
            let odd = parseFloat(resBox.getAttribute('data-odd')) || 1.50;

            addLeg(matchName, market, line, odd);
        };

        window.addToTicket = function() {
            const name = document.getElementById('match-name').value;
            const market = document.getElementById('match-market').value;
            const line = document.getElementById('match-line').value;
            const odd = parseFloat(document.getElementById('match-odd').value);

            if (!name || isNaN(odd)) return alert("Preencha o nome do jogo e a odd!");
            
            addLeg(name, market, line, odd);
            document.getElementById('match-name').value = '';
            document.getElementById('match-odd').value = '';
        };

        function addLeg(name, market, line, odd) {
            currentTicket.push({ name, market, line, odd, status: 'pending' });
            renderTicket();
        }

        window.removeLeg = function(index) {
            currentTicket.splice(index, 1);
            renderTicket();
        };

        function renderTicket() {
            const container = document.getElementById('ticket-container');
            const list = document.getElementById('ticket-list');
            const oddLabel = document.getElementById('ticket-total-odd');

            if (currentTicket.length === 0) {
                container.style.display = 'none';
                return;
            }

            container.style.display = 'block';
            list.innerHTML = '';
            
            let totalOdd = 1;
            currentTicket.forEach((leg, index) => {
                totalOdd *= leg.odd;
                list.innerHTML += `<li><span><b>${leg.name}</b><br><span style="color:var(--highlight);">${leg.market} - ${leg.line} (@${leg.odd.toFixed(2)})</span></span> <button onclick="window.removeLeg(${index})">X</button></li>`;
            });

            oddLabel.innerText = totalOdd.toFixed(2);
        }

        window.confirmBet = async function() {
            const stake = parseFloat(document.getElementById('ticket-stake').value);
            if (isNaN(stake) || stake <= 0) return alert("Insira um valor válido de aposta.");
            
            let totalOdd = currentTicket.reduce((acc, leg) => acc * leg.odd, 1);
            const type = currentTicket.length > 1 ? 'Múltipla' : 'Simples';

            const newBet = {
                type: type, stake: stake, totalOdd: totalOdd,
                matches: currentTicket, status: 'pending', createdAt: serverTimestamp()
            };

            try {
                await addDoc(betsCol, newBet);
                currentTicket = [];
                document.getElementById('ticket-stake').value = '';
                renderTicket();
            } catch (error) {
                console.error("Erro ao salvar:", error);
            }
        };

        const qBets = query(betsCol, orderBy("createdAt", "desc"));
        onSnapshot(qBets, (snapshot) => {
            allBets = [];
            snapshot.forEach(doc => { allBets.push({ id: doc.id, ...doc.data() }); });
            renderHistory();
            updateDashboard();
        });

        window.updateLegStatus = async function(betId, legIndex, newStatus) {
            const bet = allBets.find(b => b.id === betId);
            if (!bet) return;
            bet.matches[legIndex].status = newStatus;
            
            let hasRed = bet.matches.some(m => m.status === 'red');
            let allGreen = bet.matches.every(m => m.status === 'green');
            let finalStatus = hasRed ? 'red' : (allGreen ? 'green' : 'pending');

            try {
                await updateDoc(doc(db, "escanteios_bets", betId), { matches: bet.matches, status: finalStatus });
            } catch(e) { console.error("Erro:", e); }
        };

        function renderHistory() {
            const list = document.getElementById('bet-list');
            list.innerHTML = '';
            allBets.forEach(bet => {
                let cardClass = bet.status === 'green' ? 'status-green' : (bet.status === 'red' ? 'status-red' : 'status-pending');
                let returnPot = (bet.stake * bet.totalOdd).toFixed(2);
                let html = `
                    <div class="bet-card ${cardClass}">
                        <div class="bet-header">
                            <span class="bet-type">${bet.type}</span>
                            <div class="bet-finances">Stake: R$ ${bet.stake.toFixed(2)}<br><span style="color:var(--highlight)">Retorno: R$ ${returnPot}</span></div>
                        </div>
                        <div class="legs">
                `;
                bet.matches.forEach((leg, index) => {
                    let legActions = leg.status === 'pending' 
                        ? `<button class="btn-g" onclick="window.updateLegStatus('${bet.id}', ${index}, 'green')">G</button> <button class="btn-r" onclick="window.updateLegStatus('${bet.id}', ${index}, 'red')">R</button>`
                        : (leg.status === 'green' ? `<span class="badge badge-green">GREEN</span>` : `<span class="badge badge-red">RED</span>`);
                    
                    let marketLabel = leg.market ? `${leg.market} - ${leg.line}` : "Total (>0-10)";

                    html += `
                        <div class="leg-item">
                            <div class="leg-info"><b>${leg.name}</b><br><span style="color:#8b949e; font-size:0.75rem;">${marketLabel} (@${leg.odd.toFixed(2)})</span></div>
                            <div class="leg-actions">${legActions}</div>
                        </div>`;
                });
                list.innerHTML += html + `</div></div>`;
            });
        }

        function updateDashboard() {
            let totalInvested = 0, totalReturn = 0;
            allBets.forEach(bet => {
                totalInvested += bet.stake;
                if (bet.status === 'green') totalReturn += (bet.stake * bet.totalOdd);
            });
            let profit = totalReturn - totalInvested;
            document.getElementById('dash-invested').innerText = `R$ ${totalInvested.toFixed(2)}`;
            document.getElementById('dash-return').innerText = `R$ ${totalReturn.toFixed(2)}`;
            const profitEl = document.getElementById('dash-profit');
            profitEl.innerText = `R$ ${profit.toFixed(2)}`;
            profitEl.style.color = profit >= 0 ? 'var(--primary)' : 'var(--danger)';
        }
    </script>
</body>
</html>
